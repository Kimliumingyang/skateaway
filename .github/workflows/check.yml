name: SkateAway checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/playable-skateaway]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests and compile production bundle
        run: npm run check
